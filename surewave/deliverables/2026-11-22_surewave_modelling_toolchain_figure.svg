<polyline points="790,322 810,322" fill="none" stroke="#1F5373" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="790,542 900,542 900,405" fill="none" stroke="#1F5373" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="892" y="440" font-size="12" font-style="italic" fill="#1F5373" text-anchor="end">sensor-data interface</text>
