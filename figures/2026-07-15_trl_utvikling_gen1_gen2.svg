<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Arial, sans-serif" font-size="14">
  <title>Sunlit Sea CONNECT — TRL-utvikling gen 1 og gen 2</title>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="bold">
    Sunlit Sea CONNECT — TRL-utvikling for gen 1 og gen 2
  </text>

  <!-- Plot area border -->
  <rect x="80" y="60" width="660" height="360" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Horizontal grid lines (TRL 1..9) -->
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="80" y1="60"  x2="740" y2="60"/>
    <line x1="80" y1="105" x2="740" y2="105"/>
    <line x1="80" y1="150" x2="740" y2="150"/>
    <line x1="80" y1="195" x2="740" y2="195"/>
    <line x1="80" y1="240" x2="740" y2="240"/>
    <line x1="80" y1="285" x2="740" y2="285"/>
    <line x1="80" y1="330" x2="740" y2="330"/>
    <line x1="80" y1="375" x2="740" y2="375"/>
  </g>

  <!-- Vertical grid lines (years) -->
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="190" y1="60" x2="190" y2="420"/>
    <line x1="300" y1="60" x2="300" y2="420"/>
    <line x1="410" y1="60" x2="410" y2="420"/>
    <line x1="520" y1="60" x2="520" y2="420"/>
    <line x1="630" y1="60" x2="630" y2="420"/>
  </g>

  <!-- Y-axis label -->
  <text x="30" y="55" text-anchor="start" font-weight="bold">TRL</text>

  <!-- Y-axis tick labels -->
  <g text-anchor="end" fill="#333">
    <text x="72" y="65">9</text>
    <text x="72" y="110">8</text>
    <text x="72" y="155">7</text>
    <text x="72" y="200">6</text>
    <text x="72" y="245">5</text>
    <text x="72" y="290">4</text>
    <text x="72" y="335">3</text>
    <text x="72" y="380">2</text>
    <text x="72" y="425">1</text>
  </g>

  <!-- X-axis label -->
  <text x="770" y="440" text-anchor="start" font-weight="bold">År</text>

  <!-- X-axis tick labels -->
  <g text-anchor="middle" fill="#333">
    <text x="80"  y="440">2021</text>
    <text x="190" y="440">2022</text>
    <text x="300" y="440">2023</text>
    <text x="410" y="440">2024</text>
    <text x="520" y="440">2025</text>
    <text x="630" y="440">2026</text>
    <text x="740" y="440">2027</text>
  </g>

  <!-- Gen 1 curve: rise 2021-2022, plateau at TRL 7 from mid-2022 onwards -->
  <path d="M 80 375 C 130 360, 165 220, 245 150 L 740 150"
        fill="none" stroke="#1f77b4" stroke-width="3"/>
  <text x="200" y="140" fill="#1f77b4" font-weight="bold">gen 1</text>

  <!-- Gen 2 curve: start 2024 at TRL 2, S-curve rising to TRL 9 by end 2027 -->
  <path d="M 410 375 C 470 370, 500 260, 570 220 C 640 190, 700 90, 740 60"
        fill="none" stroke="#ff7f0e" stroke-width="3"/>
  <text x="600" y="215" fill="#ff7f0e" font-weight="bold">gen 2</text>

  <!-- Annotation: gen 1 tatt i bruk ca 2023 -->
  <g font-size="11" fill="#666">
    <line x1="300" y1="150" x2="300" y2="60" stroke="#bbb" stroke-dasharray="3,3"/>
  </g>

  <!-- Annotation: gen 2 utviklingsstart 2024-01-01 -->
  <g font-size="11" fill="#666">
    <line x1="410" y1="375" x2="410" y2="60" stroke="#bbb" stroke-dasharray="3,3"/>
  </g>

  <!-- Legend at bottom -->
  <g font-size="12">
    <rect x="90" y="465" width="18" height="3" fill="#1f77b4"/>
    <text x="114" y="470" alignment-baseline="middle">gen 1 (i drift, TRL 7)</text>

    <rect x="290" y="465" width="18" height="3" fill="#ff7f0e"/>
    <text x="314" y="470" alignment-baseline="middle">gen 2 (under utvikling, TRL 5-6, lansering estimert 2027)</text>
  </g>
</svg>
